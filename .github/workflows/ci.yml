name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build, tests and migration checks
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: api/global.json

      - run: dotnet restore
      - run: dotnet tool restore

      # Warnings are errors (Directory.Build.props), so this is also the
      # analyzer and code-style gate.
      - run: dotnet build --no-restore --configuration Release

      # Integration tests start their own SQL Server with Testcontainers and
      # apply the committed migrations to it.
      - run: dotnet test --no-build --configuration Release

      - name: Fail if the model has changes with no migration
        run: dotnet ef migrations has-pending-model-changes --project src/Doorlist.Api --configuration Release --no-build

      - name: Generate the idempotent migration script for review
        run: dotnet ef migrations script --idempotent --project src/Doorlist.Api --configuration Release --no-build --output ../artifacts/migrations.sql

      - uses: actions/upload-artifact@v4
        with:
          name: migrations-sql
          path: artifacts/migrations.sql

  web:
    name: Web lint, tests and build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck:e2e
      - run: npm test -- --watch=false
      - run: npm run build

  mobile:
    name: Mobile lint, tests and bundle
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

      # Every dependency matches the Expo SDK, and the app config is valid.
      - run: npx expo-doctor@1.20.4

      # Bundles the JavaScript for iOS and Android and compiles it to Hermes
      # bytecode, as a release build does. Native builds are made locally and
      # by EAS, not here (ADR 9).
      - run: npm run bundle

  schema-compat:
    name: Running API survives this PR's migrations
    timeout-minutes: 20
    # Only pull requests have a "running version" to compare with: main.
    if: github.event_name == 'pull_request'
    needs: [api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run main's API against this PR's migrations
        run: scripts/check-schema-compat.sh "${{ github.event.pull_request.base.sha }}"

  compose:
    name: Full stack smoke test
    timeout-minutes: 20
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: docker compose up --detach --build

      - name: Wait for the API through nginx
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/api/health; then
              echo " after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy"
          exit 1

      - name: Publish an event, claim a ticket and check it in, through nginx
        run: |
          base=http://localhost:8080/api
          json='Content-Type: application/json'
          login() { curl --fail --silent -H "$json" -d "{\"email\":\"$1\",\"password\":\"Doorlist-demo-2026\"}" "$base/auth/login" | jq -r .accessToken; }
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/tickets/mine")" = 401

          organizer=$(login organizer@example.com)
          starts=$(jq -nr '(now + 604800) | todate')
          ends=$(jq -nr '(now + 615600) | todate')
          event=$(curl --fail --silent -H "Authorization: Bearer $organizer" -H "$json" \
            -d "{\"name\":\"CI smoke\",\"venue\":\"Main Hall\",\"startsAt\":\"$starts\",\"endsAt\":\"$ends\"}" "$base/events" | jq .id)
          type=$(curl --fail --silent -H "Authorization: Bearer $organizer" -H "$json" \
            -d '{"name":"General admission","capacity":5}' "$base/events/$event/ticket-types" | jq .id)
          curl --fail --silent -X POST -H "Authorization: Bearer $organizer" "$base/events/$event/publish" >/dev/null

          attendee=$(curl --fail --silent -H "$json" \
            -d '{"email":"ci@example.com","password":"Doorlist-demo-2026","displayName":"CI"}' "$base/auth/register" | jq -r .accessToken)
          code=$(curl --fail --silent -H "Authorization: Bearer $attendee" -H "$json" \
            -d "{\"ticketTypeId\":$type,\"quantity\":1}" "$base/events/$event/tickets" | jq -r '.[0].code')

          door=$(login door@example.com)
          outcome=$(curl --fail --silent -H "Authorization: Bearer $door" -H "$json" \
            -d "{\"deviceId\":\"ci\",\"scans\":[{\"scanId\":\"$(uuidgen)\",\"code\":\"$code\",\"scannedAt\":\"$(jq -nr 'now | todate')\"}]}" \
            "$base/events/$event/checkins" | jq -r '.results[0].outcome')
          test "$outcome" = admitted

      - name: Browse events and fetch the ticket signing key without signing in
        run: |
          base=http://localhost:8080/api
          curl --fail --silent "$base/events" | jq -e 'type == "array"' >/dev/null
          curl --fail --silent "$base/tickets/signing-key" | jq -e '.algorithm == "ES256"'

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The whole flow in a real browser, through nginx and the production
      # build: organizer publishes, attendee claims, door checks in online
      # and offline. The CSP is enforced, and any violation fails the test.
      - name: Browser tests
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results

      - if: failure()
        run: docker compose logs

      - if: always()
        run: docker compose down --volumes
