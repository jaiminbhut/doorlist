name: Deploy

# After CI passes on main: build the images once, deploy them to staging,
# then to production. Production waits for a reviewer, configured on the
# "production" environment in the repository settings.
#
# Nothing runs until the repository variable DEPLOY_ENABLED is "true", so
# merges before the server exists don't fail. See deploy/README.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    name: Build and push images
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: tag
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: api
          target: api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/shiplog-api:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Migration bundle image
        uses: docker/build-push-action@v6
        with:
          context: api
          target: migrate
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/shiplog-migrate:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/shiplog-web:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  staging:
    needs: images
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      tag: ${{ needs.images.outputs.tag }}
      sha: ${{ needs.images.outputs.sha }}
    secrets: inherit

  production:
    needs: [images, staging]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      tag: ${{ needs.images.outputs.tag }}
      sha: ${{ needs.images.outputs.sha }}
    secrets: inherit
