# Local stack: SQL Server, a one-shot migration step, the API, and the Angular
# app behind nginx. `docker compose up --build`, then open http://localhost:8080.
#
# Every secret below has a local-development default only. Override them in a
# .env file (see .env.example); deployed environments use their own secrets
# and a non-SA database login (milestone 3).
#
# Demo users (password: DOORLIST_DEMO_PASSWORD, default Doorlist-demo-2026):
#   lead@example.com, developer@example.com, viewer@example.com

name: doorlist

x-db-connection: &db-connection "Server=db;Database=Doorlist;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Doorlist_local_Passw0rd};TrustServerCertificate=True"

services:
  db:
    # SQL Server publishes linux/amd64 images only; on Apple Silicon this runs
    # under Rosetta (colima start --vm-type vz --vz-rosetta).
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Doorlist_local_Passw0rd}
    ports:
      - "1433:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  migrate:
    build:
      context: ./api
      target: migrate
    command: ["--connection", *db-connection]
    depends_on:
      db:
        condition: service_healthy

  seed:
    # The API image, run once with a command: creates the roles and demo users.
    image: doorlist-api:local
    build:
      context: ./api
      target: api
    command: ["seed-demo-users"]
    environment:
      ConnectionStrings__Doorlist: *db-connection
      Demo__Password: ${DOORLIST_DEMO_PASSWORD:-Doorlist-demo-2026}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    image: doorlist-api:local
    build:
      context: ./api
      target: api
    environment:
      ConnectionStrings__Doorlist: *db-connection
      Auth__Jwt__SigningKey: ${DOORLIST_JWT_SIGNING_KEY:-local-development-signing-key-not-for-production}
      # Local only, like the other defaults here (ADR 7).
      Tickets__SigningKey: ${DOORLIST_TICKET_SIGNING_KEY:-MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgwktnD/CdBfVEop8S2pcp4EtwAIDnY5vBPWC86fWhusqhRANCAARHIMeNvMgQngI5/CN1oJLhDSPptW+LZZnZQC5Yxxqlu2XUK331Jfc7Pd+j9QuQhrsEOzV8QYzHAC+e6KT0Q5Ce}
    ports:
      - "5080:8080"
    depends_on:
      seed:
        condition: service_completed_successfully

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
