# One environment (staging or production). The same file serves both: the
# project name (doorlist-staging, doorlist-production) and app/.env make them
# different. IMAGE_TAG is the commit being deployed. The migrate and seed
# steps sit behind the "steps" profile, so `up` never starts them;
# scripts/deploy.sh runs them once with `run --rm`.

services:
  migrate:
    image: ${IMAGE_REGISTRY}/doorlist-migrate:${IMAGE_TAG:?}
    profiles: [steps]
    command: ["--connection", "${MIGRATOR_CONNECTION:?}"]
    networks: [data]

  seed:
    image: ${IMAGE_REGISTRY}/doorlist-api:${IMAGE_TAG:?}
    profiles: [steps]
    command: ["seed-demo-users"]
    environment:
      ConnectionStrings__Doorlist: ${APP_CONNECTION:?}
      Demo__Password: ${DEMO_PASSWORD:-}
    networks: [data]

  api:
    image: ${IMAGE_REGISTRY}/doorlist-api:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      ConnectionStrings__Doorlist: ${APP_CONNECTION:?}
      Auth__Jwt__SigningKey: ${JWT_SIGNING_KEY:?}
      Tickets__SigningKey: ${TICKETS_SIGNING_KEY:?}
    networks: [default, data]

  web:
    image: ${IMAGE_REGISTRY}/doorlist-web:${IMAGE_TAG:?}
    restart: unless-stopped
    depends_on: [api]
    networks:
      default:
      edge:
        # Caddy routes to staging-web or production-web.
        aliases: ["${ENVIRONMENT:?}-web"]

networks:
  edge:
    name: doorlist-edge
    external: true
  data:
    name: doorlist-data
    external: true
