<header class="site-header">
  <div class="container header-row">
    <div>
      <h1><a routerLink="/events">Doorlist</a></h1>
      <p>Free tickets, checked at the door.</p>
    </div>

    <nav aria-label="Main">
      <a routerLink="/events" routerLinkActive="active">Events</a>
      @if (auth.isAttendee()) {
        <a routerLink="/tickets" routerLinkActive="active">My tickets</a>
      }
      @if (auth.canManageEvents()) {
        <a routerLink="/organizer" routerLinkActive="active">Organize</a>
      }
      @if (auth.canCheckIn()) {
        <a routerLink="/door" routerLinkActive="active">Door</a>
      }

      @if (auth.user(); as user) {
        <span class="muted">{{ user.displayName }} · {{ user.roles.join(', ') }}</span>
        <button class="secondary" type="button" (click)="signOut()">Sign out</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active">Sign in</a>
        <a routerLink="/signup" routerLinkActive="active">Sign up</a>
      }
    </nav>
  </div>
</header>

<main class="container">
  <router-outlet />
</main>
