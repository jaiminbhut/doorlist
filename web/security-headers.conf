# Included by every location in nginx.conf: nginx drops server-level
# add_header directives in any location that sets its own headers.
#
# Scripts only from this origin, never inline (ADR 4). Styles allow inline
# because Angular adds component styles as <style> tags at runtime. The API
# is on the same origin, so connect-src 'self' covers it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
